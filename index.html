<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Title & SEO -->
    <title>BU Leitor SP - Eleições 2026</title>
    <meta name="description" content="Plataforma oficial de auditoria, leitura de QR Code do Boletim de Urna e totalização no Estado de São Paulo." />
    <meta property="og:title" content="BU Leitor SP - Eleições 2026" />
    <meta property="og:description" content="Plataforma oficial de auditoria, leitura de QR Code do Boletim de Urna e totalização no Estado de São Paulo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme & Colors for Android & iOS -->
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />

    <!-- Android PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BU Leitor SP" />

    <!-- iOS Safari PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BU Leitor SP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iOS Splash and Touch Optimizations -->
    <style>
      /* Safe area insets for iOS notches and Android navigation bars */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      body {
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
